[project]
name = "justin"
version = "0.3.0"
description = "Justin: answers and locations for questions about time series (inference only)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "huggingface-hub>=1.3,<2",
    "numpy>=2,<3",
    "safetensors>=0.4,<1",
    "torch>=2.6,<3",
    "transformers>=5.3,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["justin", "justin.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
