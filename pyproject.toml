[project]
name = "justin"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1,<9",
    "datasets>=4,<6",
    "huggingface-hub>=1.3,<2",
    "numpy>=2,<3",
    "pyyaml>=6,<7",
    "safetensors>=0.4,<1",
    "torch>=2.6,<3",
    "tqdm>=4.70.1",
    "transformers>=5.3,<6",
    "wfdb>=4.2,<5",
]

[project.scripts]
justin = "justin.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["justin", "justin.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.src]
include = ["justin", "tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
